name: Deploy Hugo Site to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.128.0'
          extended: false

      - name: Build Hugo
        run: hugo --minify --gc --baseURL "https://forgeandflight.com/"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 91fbd2ec539a1f2ab4696f69ab566c3b
          projectName: forge-and-flight-holdings
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
