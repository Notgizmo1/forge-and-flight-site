name: Scheduled Content Publish

on:
  schedule:
    - cron: '0 12 * * 3'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Cloudflare Pages rebuild
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "Scheduled Deploy"
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .last-deploy
          git add .last-deploy
          git commit -m "chore: scheduled content publish $(date -u '+%Y-%m-%d')" || echo "Nothing to commit"
          git push
