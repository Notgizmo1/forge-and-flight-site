name = "forge-and-flight-site"
main = "worker/index.js"
compatibility_date = "2025-01-15"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Route contact form through Worker
[[route_rules]]
pattern = "/api/*"
zone_name = "forgeandflight.com"

# Custom domain setup
[[routes]]
pattern = "forgeandflight.com/*"
custom_domain = true

[[routes]]
pattern = "www.forgeandflight.com/*"
custom_domain = true

# Environment variables
[vars]
ENVIRONMENT = "production"

# For staging/preview deployments
[env.staging]
name = "forge-and-flight-site-staging"
